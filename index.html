<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Equipos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<h1>Control de Equipos</h1>

<h2>Registrar Equipo</h2>
<input type="text" id="codigo" placeholder="Código">
<input type="text" id="tipo" placeholder="Tipo">
<input type="text" id="marca" placeholder="Marca">
<input type="text" id="modelo" placeholder="Modelo">
<button onclick="registrarEquipo()">Registrar</button>

<h2>Asignar Equipo</h2>
<input type="text" id="codigoAsignar" placeholder="Código">
<input type="text" id="trabajador" placeholder="Trabajador">
<button onclick="asignarEquipo()">Asignar</button>

<h2>Devolver Equipo</h2>
<input type="text" id="codigoDevolver" placeholder="Código">
<button onclick="devolverEquipo()">Devolver</button>

<h2>Lista de Equipos</h2>
<button onclick="mostrarEquipos()">Mostrar</button>

<table border="1">
  <thead>
    <tr>
      <th>Código</th>
      <th>Tipo</th>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Estado</th>
      <th>Trabajador</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<script src="js/app.js"></script>
</body>
</html>
